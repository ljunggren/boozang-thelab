name: Test Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: "Stage 1: Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false --ci --coverage
        env:
          CI: true

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/
          retention-days: 7

  playwright-tests:
    name: "Stage 2: Playwright Tests"
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start application
        run: npm run server & npm start &
        env:
          CI: true

      - name: Wait for application to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  boozang-e2e-tests:
    name: "Stage 3: Boozang E2E Tests"
    needs: playwright-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start application
        run: npm run server & npm start &
        env:
          CI: true

      - name: Wait for application to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Verify application is running
        run: curl http://localhost:3000

      - name: Run Boozang E2E tests
        env:
          BOOZANG_TEST_URL: ${{ secrets.BOOZANG_TEST_URL }}
        run: |
          if [ -n "$BOOZANG_TEST_URL" ]; then
            echo "Running Boozang E2E tests..."
            docker run --network host -v ${{ github.workspace }}/json:/var/boozang/json styrman/boozang-runner "$BOOZANG_TEST_URL"
          else
            echo "BOOZANG_TEST_URL secret not configured - skipping Boozang E2E tests"
            echo "To enable Boozang tests, add the BOOZANG_TEST_URL secret to your repository"
          fi

      - name: Generate test report
        if: always()
        run: npm install multiple-cucumber-html-reporter --save-dev && node reporter.js

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
